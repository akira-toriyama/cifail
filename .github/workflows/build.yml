name: build

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared Go CI core (build / vet / race-test / module-hygiene / golangci-lint v2),
  # SHA-pinned once in the hub. go.mod carries a `toolchain` line, so gotoolchain is
  # left unset — setup-go honors and pins it (see the reusable's header footgun note).
  ci:
    uses: akira-toriyama/.github/.github/workflows/go-ci.yml@v2.2.0
    with:
      go-version-file: go.mod

  # Do the tests this pull request adds actually bite? The gate runs them against
  # the source BEFORE the pull request and fails the ones that all still pass — a
  # test that would have been green without its own fix is not evidence of that fix,
  # and nothing but habit was checking. Stands down on its own when there is nothing
  # to prove (no shipping change, no new test, an annotated behaviour pin), so it
  # costs a pull request nothing to carry.
  # Rationale + the two opt-outs: akira-toriyama/.github/blob/main/docs/go-bite.md
  bite:
    uses: akira-toriyama/.github/.github/workflows/go-bite.yml@v2
    with:
      go-version-file: go.mod

  # Repo-specific checks that don't belong in the shared core. The fuzz target is
  # OS-independent (Linux leg only); the smoke runs on every leg so the shipped
  # binary (macOS brew cask) is exercised on darwin too — matching the pre-migration
  # matrix, which the core test job (build + unit tests) doesn't cover.
  extras:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Build/test-only, never pushes — drop the persisted checkout token
          # (zizmor artipacked). t-yaxa
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Short exploratory fuzz of the extract budget invariants (no-panic,
      # used<=budget, well-formed excerpts). Linux leg only — OS-independent; the
      # seed corpus runs under -race in the shared core.
      - name: fuzz smoke (extract)
        if: runner.os == 'Linux'
        run: go test -run='^$' -fuzz='^FuzzExtract$' -fuzztime=15s ./internal/extract

      - name: smoke test
        run: |
          go build -o /tmp/cifail ./cmd/cifail
          /tmp/cifail version
          /tmp/cifail --version
          /tmp/cifail --help >/dev/null
